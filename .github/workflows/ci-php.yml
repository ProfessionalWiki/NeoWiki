name: NeoWiki CI (PHP)

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/workflows/ci-ts.yml'
      - '.github/workflows/ci-redherb.yml'
      - '.github/workflows/neo-ci-ts.yml'
      - 'resources/**'
      - 'Neo/neojs/**'
  pull_request:
    paths-ignore:
      - '.github/workflows/ci-ts.yml'
      - '.github/workflows/ci-redherb.yml'
      - '.github/workflows/neo-ci-ts.yml'
      - 'resources/**'
      - 'Neo/neojs/**'

jobs:
  test:
    name: "PHPUnit: MW ${{ matrix.mw }}, PHP ${{ matrix.php }}"

    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - mw: 'REL1_43'
            php: '8.3'
            experimental: false
          - mw: 'REL1_44'
            php: '8.3'
            experimental: false
          - mw: 'REL1_45'
            php: '8.3'
            experimental: false
          - mw: 'REL1_46'
            php: '8.4'
            experimental: false
          - mw: 'master'
            php: '8.5'
            experimental: true

    runs-on: ubuntu-latest

    env:
      NEO4J_URL_OVERRIDE: bolt://neo4j:password@localhost:7689
      NEO4J_URL_READ_OVERRIDE: bolt://mediawiki_read:mediawiki_read@localhost:7689
      # Live QLever store for the SPARQL query system test. Overrides the dev-stack hostname in
      # phpunit.xml.dist (PHPUnit <env> does not override an existing environment variable), so the test
      # reaches the QLever the "Start QLever" step publishes on the runner's localhost.
      QLEVER_TEST_URL: http://localhost:7019/
      QLEVER_TEST_ACCESS_TOKEN: neowiki_test_token
      # Live Oxigraph store for the same system test run against a second engine, published by the
      # "Start Oxigraph" step.
      OXIGRAPH_TEST_BASE_URL: http://localhost:7878
      # Live Fuseki store for a third run of the same system test, published by the "Start Fuseki" step.
      # Nothing outside CI sets this, and QueryFusekiEndToEndTest skips without it, so this line is what
      # makes that suite run at all.
      FUSEKI_TEST_BASE_URL: http://localhost:3030/ds

    services:
      test_neo:
        image: neo4j:enterprise
        ports:
          - 7689:7689
          - 7475:7475
        env:
          NEO4J_ACCEPT_LICENSE_AGREEMENT: eval
          NEO4J_AUTH: neo4j/password
          NEO4J_server_bolt_listen__address: :7689
          NEO4J_server_http_listen__address: :7475
        options: --name test_neo --hostname test_neo

    defaults:
      run:
        working-directory: mediawiki

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          tools: composer

      - name: Disable Composer block-insecure
        working-directory: ~
        run: composer config --global audit.block-insecure false

      - name: Cache MediaWiki
        id: cache-mediawiki
        uses: actions/cache@v5
        with:
          path: |
            mediawiki
            !mediawiki/extensions/
            !mediawiki/vendor/
          key: mw_${{ matrix.mw }}-php${{ matrix.php }}-v2

      - name: Cache Composer cache
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-php${{ matrix.php }}

      - uses: actions/checkout@v6
        with:
            path: EarlyCopy

      - name: Install MediaWiki
        if: steps.cache-mediawiki.outputs.cache-hit != 'true'
        working-directory: ~
        run: bash EarlyCopy/.github/workflows/installMediaWiki.sh ${{ matrix.mw }} NeoWiki

      - uses: actions/checkout@v6
        with:
          path: mediawiki/extensions/NeoWiki

      - name: Load RedHerb test extension
        run: echo 'wfLoadExtension( "RedHerb", "$IP/extensions/NeoWiki/tests/RedHerb/extension.json" );' >> LocalSettings.php

      - run: composer update

      # Asks Neo4j to answer a query rather than to open its port, which is what the next step needs of it.
      # Not a `--health-cmd` on the service: that gates every step on it, measured at some 26 seconds a leg.
      - name: Wait for Neo4j
        run: |
          timeout 90 bash -c 'until docker exec test_neo cypher-shell -u neo4j -p password -a bolt://localhost:7689 "RETURN 1" >/dev/null 2>&1; do sleep 2; done' \
            || { echo "Neo4j did not become ready in time; dumping logs:"; docker logs test_neo; exit 1; }

      # QLever for the SPARQL query system test. It cannot be a `services:` container: its bring-up needs
      # a multi-step entrypoint (build an empty index, then serve) that a service container cannot express
      # (no command/args, only an image + options). So it is started explicitly, like the "Create neo4j
      # user" docker step below. --persist-updates is omitted: the store is fresh per CI run and the test
      # clears it, so keeping updates in memory is enough. The index is built in /tmp rather than the dev
      # stack's /index: the image runs as a non-root user with no /index (the dev stack provides it via a
      # volume), so a bare `docker run` must use an already-writable in-image path.
      # --service-allowed-iri-prefixes disables SPARQL federation, matching the dev stack (see
      # Docker/docker-compose.dev.yml): QLever allows every SERVICE IRI unless the option is given, and "-"
      # is the documented deny-all value (an invalid prefix no IRI matches). No test federates.
      - name: Start QLever
        run: |
          docker run -d --name test_qlever -p 7019:7019 -e QLEVER_ACCESS_TOKEN=neowiki_test_token \
            --entrypoint /bin/bash docker.io/adfreiburg/qlever:latest -lc '
              set -e
              cd /tmp
              : > data.nt
              qlever-index -i neowiki -F nt -f data.nt
              exec qlever-server -i neowiki -p 7019 -a "$QLEVER_ACCESS_TOKEN" -m 1G --service-allowed-iri-prefixes -'

      # Oxigraph, the second SPARQL engine the same system test runs against. Started explicitly next
      # to QLever rather than as a `services:` container, so the serve flags are stated here rather than
      # inherited from the image's default. They mirror the test_oxigraph
      # dev-stack service (see Docker/docker-compose.dev.yml) — no --union-default-graph, so the store
      # is spec-strict; no --location, so it is in memory, which is all a fresh-per-run CI store needs.
      # No access-token flag: Oxigraph has no authentication (oxigraph#88). No federation flag either:
      # Oxigraph federates unconditionally and offers no option to restrict it — see
      # docs/operations/installation.md#restricting-federation.
      - name: Start Oxigraph
        run: |
          docker run -d --name test_oxigraph -p 127.0.0.1:7878:7878 \
            ghcr.io/oxigraph/oxigraph:latest serve --bind 0.0.0.0:7878

      # Apache Jena Fuseki, which the same system test runs against a third time. It is here as a
      # conformance target, not as an engine NeoWiki ships: Jena is the most complete SPARQL 1.1
      # implementation to check the emitted queries and updates against. The version is pinned for that
      # reason — the reference to test against should change deliberately, not with upstream releases.
      # Apache publishes no container image, so instead of trusting a third-party build this runs the
      # release Apache itself publishes: the tarball comes from the ASF archive (cached, so the archive
      # is only hit when the pin changes) and is checked against the checksum recorded here before
      # anything in it runs. `--mem /ds` serves an in-memory dataset unauthenticated on /ds/query and
      # /ds/update, which is all a fresh-per-run CI store needs, and keeps named graphs out of the
      # default graph the way Oxigraph above does — the spec-strict behaviour the suite asserts.
      # JVM_ARGS caps a heap the launcher otherwise defaults to -Xmx4G.
      - name: Cache Fuseki
        uses: actions/cache@v5
        with:
          path: ~/fuseki-dist
          key: fuseki-6.2.0

      - name: Start Fuseki
        env:
          FUSEKI_VERSION: 6.2.0
          FUSEKI_SHA512: ba65f5867d2d4741b2ed9e2af5a0d4fbb447909894ab2a0c6bc4dac8997f4fe339c87b13c48d45d054977769f0f8bf763ea346b1f7792d5cdc458041bd43a132
        run: |
          mkdir -p ~/fuseki-dist && cd ~/fuseki-dist
          if [ ! -f "apache-jena-fuseki-$FUSEKI_VERSION.tar.gz" ]; then
            curl -fsSL -o "apache-jena-fuseki-$FUSEKI_VERSION.tar.gz" \
              "https://archive.apache.org/dist/jena/binaries/apache-jena-fuseki-$FUSEKI_VERSION.tar.gz"
          fi
          echo "$FUSEKI_SHA512  apache-jena-fuseki-$FUSEKI_VERSION.tar.gz" | sha512sum -c -
          tar -xzf "apache-jena-fuseki-$FUSEKI_VERSION.tar.gz"
          cd "apache-jena-fuseki-$FUSEKI_VERSION"
          JAVA_HOME="$JAVA_HOME_21_X64" JVM_ARGS=-Xmx512m \
            nohup ./fuseki-server --mem /ds > "$RUNNER_TEMP/fuseki.log" 2>&1 &

      - name: Run update.php
        run: php maintenance/update.php --quick

      - name: Create neo4j user
        run: docker exec test_neo bash -c \
          "echo \"CREATE USER mediawiki_read SET PASSWORD 'mediawiki_read' CHANGE NOT REQUIRED; GRANT ROLE reader TO mediawiki_read;\" | cypher-shell -u neo4j -p password -a bolt://localhost:7689"

      - name: Wait for QLever
        run: |
          timeout 90 bash -c 'until curl -fsS -o /dev/null "http://localhost:7019/?query=SELECT%20%2A%20WHERE%20%7B%20%3Fs%20%3Fp%20%3Fo%20%7D%20LIMIT%201"; do sleep 2; done' \
            || { echo "QLever did not become ready in time; dumping logs:"; docker logs test_qlever; exit 1; }

      - name: Wait for Oxigraph
        run: |
          timeout 90 bash -c 'until curl -fsS -o /dev/null "http://localhost:7878/query?query=SELECT%20%2A%20WHERE%20%7B%20%3Fs%20%3Fp%20%3Fo%20%7D%20LIMIT%201"; do sleep 2; done' \
            || { echo "Oxigraph did not become ready in time; dumping logs:"; docker logs test_oxigraph; exit 1; }

      - name: Wait for Fuseki
        run: |
          timeout 90 bash -c 'until curl -fsS -o /dev/null "http://localhost:3030/ds/query?query=SELECT%20%2A%20WHERE%20%7B%20%3Fs%20%3Fp%20%3Fo%20%7D%20LIMIT%201"; do sleep 2; done' \
            || { echo "Fuseki did not become ready in time; dumping logs:"; cat "$RUNNER_TEMP/fuseki.log"; exit 1; }

      - name: Run PHPUnit
        run: composer phpunit
        working-directory: mediawiki/extensions/NeoWiki

  phpcs:
    name: "PHPCS with PHP 8.3"

    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Checkout NeoExtension
        uses: actions/checkout@v6

      - name: Install dependencies
        run: composer install

      - name: Run PHPCS
        run: vendor/bin/phpcs -p -s --standard=phpcs.xml

  PHPStan:
    name: "PHPStan: MW ${{ matrix.mw }}, PHP ${{ matrix.php }}"

    strategy:
      matrix:
        include:
          - mw: 'REL1_43'
            php: '8.3'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mediawiki

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          tools: composer

      - name: Disable Composer block-insecure
        working-directory: ~
        run: composer config --global audit.block-insecure false

      - name: Cache MediaWiki
        id: cache-mediawiki
        uses: actions/cache@v5
        with:
          path: |
            mediawiki
            !mediawiki/extensions/
            !mediawiki/vendor/
          key: mw_${{ matrix.mw }}-php${{ matrix.php }}-v2

      - name: Cache Composer cache
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-php${{ matrix.php }}

      - uses: actions/checkout@v6
        with:
          path: EarlyCopy

      - name: Install MediaWiki
        if: steps.cache-mediawiki.outputs.cache-hit != 'true'
        working-directory: ~
        run: bash EarlyCopy/.github/workflows/installMediaWiki.sh ${{ matrix.mw }} NeoWiki

      - uses: actions/checkout@v6
        with:
          path: mediawiki/extensions/NeoWiki

      - run: composer update

      - name: Composer install
        run: cd extensions/NeoWiki && composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: PHPStan
        run: cd extensions/NeoWiki && vendor/bin/phpstan analyze --configuration=phpstan.neon --memory-limit=2G

