name: Build Docker image

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  build_and_deploy_mediawiki:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install NeoWiki JavaScript dependencies
        run: npm ci
        working-directory: resources/ext.neowiki

      - name: Build NeoWiki JavaScript
        run: npm run build
        working-directory: resources/ext.neowiki

      - name: Resolve MediaWiki 1.43 commit
        id: mw
        run: echo "sha=$(git ls-remote https://github.com/wikimedia/mediawiki refs/heads/REL1_43 | cut -f1)" >> "$GITHUB_OUTPUT"

      # Keyed on the resolved commit, not the branch name, so a MediaWiki update
      # invalidates the cache rather than being masked by it. The tree is cached
      # whole, .git included, so that a hit and a miss produce the same image.
      - name: Cache MediaWiki
        id: cache-mediawiki
        uses: actions/cache@v5
        with:
          path: Docker/mediawiki
          key: mw-docker-${{ steps.mw.outputs.sha }}

      - name: Get MediaWiki 1.43
        if: steps.cache-mediawiki.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: wikimedia/mediawiki
          path: Docker/mediawiki
          ref: ${{ steps.mw.outputs.sha }}
          fetch-depth: 1

      # MediaWiki's .gitmodules point at gerrit.wikimedia.org, which rate-limits
      # (HTTP 429) partway through these ~40 back-to-back clones and fails the job.
      # Fetch from the GitHub mirrors instead, as installMediaWiki.sh already does.
      # The rewrites have to be global: git clone, which git submodule update shells
      # out to, ignores the superproject's repository-local config.
      - name: Shallow submodules
        if: steps.cache-mediawiki.outputs.cache-hit != 'true'
        working-directory: Docker/mediawiki
        run: |
          git config --global url."https://github.com/wikimedia/mediawiki-extensions-".insteadOf "https://gerrit.wikimedia.org/r/mediawiki/extensions/"
          git config --global url."https://github.com/wikimedia/mediawiki-skins-".insteadOf "https://gerrit.wikimedia.org/r/mediawiki/skins/"
          git config --global url."https://github.com/wikimedia/mediawiki-".insteadOf "https://gerrit.wikimedia.org/r/mediawiki/"
          git config --global url."https://github.com/wikimedia/".insteadOf "https://gerrit.wikimedia.org/r/VisualEditor/"
          git submodule update --init --recursive --depth 1

      # TODO: additional extensions/skins?

      - name: Copy built NeoWiki extension
        run: rsync -a --exclude='Docker/' ./ Docker/mediawiki/extensions/NeoWiki/

      - run: make wiki-production-image

      - name: Use CI docker-compose
        run: rm docker-compose.yml && mv docker-compose.ci.yml docker-compose.yml
        working-directory: Docker

      - name: Start containers
        run: make up

      - name: Install MediaWiki
        run: make install-db

      - name: Load Neo4j users
        run: make load-neo4j-users

      - run: make smoke-test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_write_packages }}
        if: github.ref == 'refs/heads/master'

      - name: Push Docker Image
        run: docker push ghcr.io/professionalwiki/neowiki:latest
        if: github.ref == 'refs/heads/master'

      - name: Delete Older Images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'neowiki'
          package-type: 'container'
          delete-only-untagged-versions: true
          token: ${{ secrets.PAT_write_packages }}
        if: github.ref == 'refs/heads/master'
