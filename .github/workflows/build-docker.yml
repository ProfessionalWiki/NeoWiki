name: Build Docker image

on:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

# Runs on one ref take turns, so a publish joins the platform images its own run pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  IMAGE: ghcr.io/professionalwiki/neowiki
  # A run on another branch builds as master too, but only master and tags publish.
  NEOWIKI_IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'master' }}
  PUBLISH: ${{ github.ref == 'refs/heads/master' || github.ref_type == 'tag' }}

jobs:

  build_and_deploy_mediawiki:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      # The bundled Makefile runs the image that a copy's Docker/image-tag names. scripts/tag-release.sh writes that
      # file into each version tag's commit and master never holds it, so a tag made any other way publishes nothing.
      - name: Check Docker/image-tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$(cat Docker/image-tag 2>/dev/null)" != "$GITHUB_REF_NAME" ]; then
              echo "Docker/image-tag does not name $GITHUB_REF_NAME: tag with scripts/tag-release.sh" >&2
              exit 1
            fi
          elif [ -e Docker/image-tag ]; then
            echo "Only version tags hold Docker/image-tag" >&2
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install NeoWiki JavaScript dependencies
        run: npm ci
        working-directory: resources/ext.neowiki

      - name: Build NeoWiki JavaScript
        run: npm run build
        working-directory: resources/ext.neowiki

      - name: Resolve MediaWiki 1.43 commit
        id: mw
        run: echo "sha=$(git ls-remote https://github.com/wikimedia/mediawiki refs/heads/REL1_43 | cut -f1)" >> "$GITHUB_OUTPUT"

      # Keyed on the resolved commit, not the branch name, so a MediaWiki update
      # invalidates the cache rather than being masked by it. The tree is cached
      # whole, .git included, so that a hit and a miss produce the same image.
      - name: Cache MediaWiki
        id: cache-mediawiki
        uses: actions/cache@v6
        with:
          path: Docker/mediawiki
          key: mw-docker-${{ steps.mw.outputs.sha }}

      - name: Get MediaWiki 1.43
        if: steps.cache-mediawiki.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: wikimedia/mediawiki
          path: Docker/mediawiki
          ref: ${{ steps.mw.outputs.sha }}
          fetch-depth: 1

      # MediaWiki's .gitmodules point at gerrit.wikimedia.org, which rate-limits
      # (HTTP 429) partway through these ~40 back-to-back clones and fails the job.
      # Fetch from the GitHub mirrors instead, as installMediaWiki.sh already does.
      # The rewrites have to be global: git clone, which git submodule update shells
      # out to, ignores the superproject's repository-local config.
      - name: Shallow submodules
        if: steps.cache-mediawiki.outputs.cache-hit != 'true'
        working-directory: Docker/mediawiki
        run: |
          git config --global url."https://github.com/wikimedia/mediawiki-extensions-".insteadOf "https://gerrit.wikimedia.org/r/mediawiki/extensions/"
          git config --global url."https://github.com/wikimedia/mediawiki-skins-".insteadOf "https://gerrit.wikimedia.org/r/mediawiki/skins/"
          git config --global url."https://github.com/wikimedia/mediawiki-".insteadOf "https://gerrit.wikimedia.org/r/mediawiki/"
          git config --global url."https://github.com/wikimedia/".insteadOf "https://gerrit.wikimedia.org/r/VisualEditor/"
          git submodule update --init --recursive --depth 1

      # TODO: additional extensions/skins?

      # A cache hit restores the NeoWiki copy of the run that saved the cache;
      # --delete drops the files removed from NeoWiki since.
      - name: Copy built NeoWiki extension
        run: rsync -a --delete --exclude='Docker/' ./ Docker/mediawiki/extensions/NeoWiki/

      # Without buildx's default provenance attestation, each platform's image is pushed as one manifest
      # that its platform tag holds, rather than as an index whose child manifests are untagged.
      - run: make wiki-production-image
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1

      - name: Use CI docker-compose
        run: rm docker-compose.yml && mv docker-compose.ci.yml docker-compose.yml
        working-directory: Docker

      - name: Start containers
        run: make up

      - name: Install MediaWiki
        run: make install-db

      - run: make smoke-test

      # Runs after the smoke test, which checks the starter Main Page that the demo data replaces.
      - run: make import-demo-data

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_write_packages }}
        if: env.PUBLISH == 'true'

      - name: Push Docker Image
        run: |
          docker tag "$IMAGE:$NEOWIKI_IMAGE_TAG" "$IMAGE:$NEOWIKI_IMAGE_TAG-${{ matrix.arch }}"
          docker push "$IMAGE:$NEOWIKI_IMAGE_TAG-${{ matrix.arch }}"
        if: env.PUBLISH == 'true'

      # scripts/tag-release.sh commits this bundle into the release tag.
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/master' && matrix.arch == 'amd64'
        with:
          name: frontend-bundle
          path: |
            resources/ext.neowiki/dist/neowiki.js
            resources/ext.neowiki/dist/neowiki.css
          if-no-files-found: error

  publish_mediawiki:
    needs: build_and_deploy_mediawiki
    runs-on: ubuntu-latest
    permissions: {}
    if: github.ref == 'refs/heads/master' || github.ref_type == 'tag'

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_write_packages }}

      - name: Publish multi-platform image
        run: |
          tags=( --tag "$IMAGE:$NEOWIKI_IMAGE_TAG" )
          if [[ $NEOWIKI_IMAGE_TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags+=( --tag "$IMAGE:latest" )
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$NEOWIKI_IMAGE_TAG-amd64" "$IMAGE:$NEOWIKI_IMAGE_TAG-arm64"

      # Delete Older Images deletes untagged versions, which includes what a tagged index points at:
      # a platform image whose tag a newer run has already taken, as when one platform of a re-run fails.
      - name: Find the images that tagged versions point at
        id: children
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_write_packages }}
        run: |
          tagged=$(gh api --paginate /orgs/ProfessionalWiki/packages/container/neowiki/versions \
            --jq '.[] | select(.metadata.container.tags != []) | .name')
          children=
          for digest in $tagged; do
            children+=$(docker buildx imagetools inspect --raw "$IMAGE@$digest" |
              jq -j '.manifests[]?.digest | "|" + .')
          done
          echo "regex=^(${children#|})\$" >> "$GITHUB_OUTPUT"

      - name: Delete Older Images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'neowiki'
          package-type: 'container'
          delete-only-untagged-versions: true
          ignore-versions: ${{ steps.children.outputs.regex }}
          token: ${{ secrets.PAT_write_packages }}
