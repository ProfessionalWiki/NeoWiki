name: Simplify

# Claude Code reads the past week's merges and proposes at most two behaviour-preserving simplifications of them as
# draft pull requests, following simplify.md. The repository is public, so what it reads is untrusted, and so is what
# it writes:
# - It has file tools only, confined to a directory holding the merges and two checkouts. It runs nothing, reads no
#   secret, and cannot reach the files through which a step sets the environment of later steps.
# - Nothing it wrote runs in this workflow, where any code could read the jobs' secrets: the job holding the PAT only
#   checks each patch, applies it and pushes it.
# - The checks admit source and test files only, which CI runs with a read-only token.

on:
  schedule:
    # Saturday, so that its use of the Claude subscription does not compete with weekday work.
    - cron: '0 2 * * 6'
  # A manual run is a dry run: it only uploads the patches.
  workflow_dispatch:

permissions: {}

concurrency: simplify

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proposals: ${{ steps.collect.outputs.proposals }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the run directory
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            open=$(gh pr list --state open --limit 1000 --json author,headRefName --jq \
              'any(.[]; .author.login == "ProWikiExperts" and (.headRefName | startswith("simplify/")))')
            [ "$open" = false ] || { echo 'Skipped: earlier proposals await review.'; exit 0; }
          fi

          run="$RUNNER_TEMP/simplify"
          mkdir "$run"
          git log --first-parent --since='7 days ago' --reverse --patch --format='%h %B' \
            -- src tests/phpunit resources/ext.neowiki/src resources/ext.neowiki/tests > "$run/merges.patch"
          [ -s "$run/merges.patch" ] || { echo 'Skipped: no merge of the past week changed code in scope.'; exit 0; }

          git worktree add --detach "$run/1"
          git worktree add --detach "$run/2"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        if: steps.prepare.outputs.ready == 'true'
        with:
          node-version: '24'

      - name: Install Claude Code
        if: steps.prepare.outputs.ready == 'true'
        run: npm install --global @anthropic-ai/claude-code@2.1.311

      - name: Propose simplifications
        if: steps.prepare.outputs.ready == 'true'
        working-directory: ${{ runner.temp }}/simplify
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The prompt is all the agent follows: the checkouts' AGENTS.md files ask for tests it cannot run.
          CLAUDE_CODE_DISABLE_CLAUDE_MDS: 1
        run: |
          claude -p --restricted --tools 'Read,Grep,Glob,Edit,Write' --strict-mcp-config \
            --permission-mode acceptEdits --permission-prompts none --model claude-opus-5-5 --effort xhigh \
            < "$GITHUB_WORKSPACE/.github/workflows/simplify.md"

      - name: Collect the proposals
        id: collect
        if: steps.prepare.outputs.ready == 'true'
        working-directory: ${{ runner.temp }}/simplify
        run: |
          mkdir "$RUNNER_TEMP/proposals"
          for n in 1 2; do
            [ -f "$n.txt" ] || continue
            # Named rather than found, so that git cannot follow a .git file the agent rewrote to a config it wrote.
            export GIT_DIR="$GITHUB_WORKSPACE/.git/worktrees/$n" GIT_WORK_TREE="$PWD/$n"
            # The agent has no tool that deletes a file, so it empties the file instead.
            git ls-files -z --modified --others --exclude-standard |
              while IFS= read -r -d '' file; do [ -s "$n/$file" ] || rm -f "$n/$file"; done
            git add --all
            git diff --cached --no-renames > "$RUNNER_TEMP/proposals/$n.patch"
            if [ -s "$RUNNER_TEMP/proposals/$n.patch" ]; then
              cp "$n.txt" "$RUNNER_TEMP/proposals/"
              echo 'proposals=true' >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: actions/upload-artifact@v7
        if: steps.collect.outputs.proposals == 'true'
        with:
          name: proposals
          path: ${{ runner.temp }}/proposals/

  publish:
    needs: propose
    if: needs.propose.outputs.proposals == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # With the machine account's PAT, because pushes and pull requests made with GITHUB_TOKEN start no CI.
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PR_TOKEN_PROWIKIEXPERTS }}

      - uses: actions/download-artifact@v8
        with:
          name: proposals
          path: ${{ runner.temp }}/proposals

      - name: Open the draft pull requests
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN_PROWIKIEXPERTS }}
        run: |
          git config user.name ProWikiExperts
          git config user.email 73494570+ProWikiExperts@users.noreply.github.com
          allowed='^(src|tests/phpunit|resources/ext\.neowiki/(src|tests))/.+\.(php|ts|vue|less)$'
          zero_width_space=$'\xe2\x80\x8b'
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          attribution="> <sub>AI-authored — Claude Code, \`Opus 5.5 (xhigh)\`; no human decision; not reviewed by a human</sub>"

          # Prints why the patch $1 may not become a pull request, or nothing.
          problem() {
            local added=0 deleted=0 add del path
            git apply --check "$1" 2>/dev/null || { echo 'it does not apply'; return; }
            [ "$(git apply --summary "$1" | grep -cvE '^ (create|delete) mode 100644 ')" = 0 ] \
              || { echo 'it changes a file mode or type'; return; }
            while IFS=$'\t' read -r add del path; do
              [ "$add" != - ] || { echo "it changes the binary file $path"; return; }
              [[ $path =~ $allowed ]] || { echo "it changes $path"; return; }
              added=$((added + add))
              deleted=$((deleted + del))
            done < <(git apply --numstat "$1")
            [ "$deleted" -gt "$added" ] || echo "it adds $added lines and removes $deleted"
          }

          for message in "$RUNNER_TEMP"/proposals/*.txt; do
            n=$(basename "$message" .txt)
            patch="$RUNNER_TEMP/proposals/$n.patch"
            git switch --quiet --detach "$GITHUB_SHA"
            reason=$(problem "$patch")
            title=$(head -n 1 "$message")
            [[ $title =~ [^[:space:]] ]] || reason='it has no title'
            if [ -n "$reason" ]; then
              echo "::warning::Proposal $n not published: $reason."
              continue
            fi

            # A zero-width space after each @, so that the agent's text mentions nobody, and in the commit message after
            # each [, so that a [skip ci] in it cannot keep CI from checking the proposal.
            title=${title:0:100}
            title=${title//@/@$zero_width_space}
            body=$(tail -n +2 "$message")
            body=${body:0:4000}
            body=${body//@/@$zero_width_space}
            branch="simplify/$GITHUB_RUN_ID-$n"

            git switch --quiet --create "$branch"
            git apply --index "$patch"
            printf '%s\n\n%s\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>\n' \
              "${title//\[/[$zero_width_space}" "${body//\[/[$zero_width_space}" | git commit --quiet --file=-
            git push --quiet origin "$branch"
            printf '%s\n\nProposed by the weekly [simplification run](%s).\n\n%s\n' "$body" "$run_url" "$attribution" |
              gh pr create --draft --base master --head "$branch" --title "$title" --body-file -
          done
