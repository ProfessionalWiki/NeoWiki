</g>

<!-- Stub Subject node -->
<rect x="240" y="450" width="170" height="86" rx="8" fill="none" stroke="#72777D" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="251" y="471" font-family="monospace" font-size="12" font-weight="bold" fill="#202122">:Subject</text>
<path stroke="#A2A9B1" d="M240,481H410"/>
<g font-family="monospace" font-size="11" xml:space="preserve">
<text x="251" y="501"><tspan fill="#72777D">id: </tspan><tspan fill="#202122">"sEpfwJLdirector"</tspan></text>
<text x="251" y="521"><tspan fill="#72777D">wiki_id: </tspan><tspan fill="#202122">"demo"</tspan></text>
</g>

<!-- HasSubject edges -->
<path stroke="#000" stroke-width="1.5" fill="none" d="M270,146V228" marker-end="url(#arrow-page)"/>
<text x="262" y="192" text-anchor="end" font-family="monospace" font-size="11" fill="#000">HasSubject {isMain: true}</text>
<path stroke="#000" stroke-width="1.5" fill="none" d="M395,93H583" marker-end="url(#arrow-page)"/>
<text x="404" y="85" font-family="monospace" font-size="11" fill="#000">HasSubject {isMain: false}</text>

<!-- Relation edges -->
<path stroke="#D96B00" stroke-width="1.5" fill="none" d="M675,166V273H412" marker-end="url(#arrow-relation)"/>
<text x="420" y="264" font-family="monospace" font-size="11" fill="#D96B00">Museum {id: "rEpfwJLAtndAaaA"}</text>
<path stroke="#D96B00" stroke-width="1.5" fill="none" d="M410,343H613" marker-end="url(#arrow-relation)"/>
<text x="420" y="334" font-family="monospace" font-size="11" fill="#D96B00">City {id: "rEpfwJLoEB5UuQS"}</text>
<path stroke="#D96B00" stroke-width="1.5" fill="none" d="M322,356V448" marker-end="url(#arrow-relation)"/>
<text x="332" y="432" font-family="monospace" font-size="11" fill="#D96B00">Director {id: "rEpfwJLdirector"}</text>

<!-- Callouts -->
<text x="200" y="85" text-anchor="end" fill="#000">Page node</text>
<path stroke="#000" d="M206,80H232"/>

<text x="290" y="180" fill="#039">Subject node</text>
<text x="290" y="196" font-size="12" fill="#039">two labels: Subject and its Schema</text>
<path stroke="#039" d="M302,202V222"/>

<text x="200" y="322" text-anchor="end" fill="#D00">Statement</text>
<text x="200" y="338" text-anchor="end" font-size="12" fill="#D00">becomes a node property</text>
<path stroke="#D00" d="M206,317H238"/>

<text x="450" y="389" fill="#D96B00">Relation</text>
<text x="450" y="405" font-size="12" fill="#D96B00">becomes a typed edge</text>
<path stroke="#D96B00" d="M462,351V371"/>

<text x="450" y="498" fill="#72777D">Stub</text>
<text x="450" y="514" font-size="12" fill="#72777D">id only, target not yet created</text>
<path stroke="#72777D" d="M444,493H418"/>
</svg>
