<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="810" height="560" viewBox="0 0 810 560"
	font-family="sans-serif" font-size="16">
<defs>
<marker id="arrow-page" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0,0L10,5L0,10z" fill="#000"/>
</marker>
<marker id="arrow-relation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0,0L10,5L0,10z" fill="#D96B00"/>
</marker>
</defs>
<rect width="810" height="560" fill="#FFF"/>

<!-- Page node -->
<rect x="240" y="40" width="155" height="106" rx="8" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="251" y="61" font-family="monospace" font-size="12" font-weight="bold" fill="#202122">:Page</text>
<path stroke="#A2A9B1" d="M240,71H395"/>
<g font-family="monospace" font-size="11" xml:space="preserve">
<text x="251" y="91"><tspan fill="#72777D">name: </tspan><tspan fill="#202122">"Rijksmuseum"</tspan></text>
<text x="251" y="111"><tspan fill="#72777D">namespaceId: </tspan><tspan fill="#202122">0</tspan></text>
<text x="251" y="131"><tspan fill="#72777D">wiki_id: </tspan><tspan fill="#202122">"demo"</tspan></text>
</g>

<!-- Attendance Subject node -->
<rect x="585" y="40" width="180" height="126" rx="8" fill="none" stroke="#390" stroke-width="1.5"/>
