<text x="596" y="151"><tspan fill="#72777D">Visitors: </tspan><tspan fill="#202122">2500000</tspan></text>
</g>

<!-- Museum Subject node -->
<rect x="240" y="230" width="170" height="126" rx="8" fill="none" stroke="#039" stroke-width="1.5"/>
<text x="251" y="251" font-family="monospace" font-size="12" font-weight="bold" fill="#202122">:Subject:Museum</text>
<path stroke="#A2A9B1" d="M240,261H410"/>
<rect x="246" y="308" width="158" height="18" fill="none" stroke="#D00" stroke-width="1.5"/>
<g font-family="monospace" font-size="11" xml:space="preserve">
