</g>

<!-- City Subject node -->
<rect x="615" y="300" width="170" height="86" rx="8" fill="none" stroke="#039" stroke-width="1.5"/>
<text x="626" y="321" font-family="monospace" font-size="12" font-weight="bold" fill="#202122">:Subject:City</text>
<path stroke="#A2A9B1" d="M615,331H785"/>
