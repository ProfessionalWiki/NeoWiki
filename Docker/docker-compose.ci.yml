services:
  mediawiki:
    image: ghcr.io/professionalwiki/neowiki:latest
    ports:
      - "127.0.0.1:${MW_SERVER_PORT}:80"
      - "127.0.0.1:8486:8486"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Duplicated from docker-compose.yml, which the image-build workflow replaces with this file.
      - MARIADB_HOST=${MARIADB_HOST:-db}
      - MARIADB_PORT=${MARIADB_PORT:-3306}
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
      - MW_SERVER
      - QLEVER_URL
      - QLEVER_ACCESS_TOKEN=${QLEVER_ACCESS_TOKEN:-neowiki_dev_token}
    healthcheck:
      test: "curl -fsSL http://localhost:80/index.php/Special:Version | grep 'Jeroen De Dauw'"
      interval: 60s
      timeout: 5s
      retries: 1

  db:
    image: mariadb:11.8
    environment:
      - MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
    healthcheck:
      test: ["CMD", "mariadb-admin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 4

  # Without the stacks' index volume the image has no /index, so the index is built in /tmp, as in
  # .github/workflows/ci-php.yml.
  qlever:
    image: docker.io/adfreiburg/qlever@sha256:881f3762f89fdb831b085503d61c87c9894dad6e6769f1774dd253925fbb4e4c
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -e
        cd /tmp
        : > data.nt
        qlever-index -i neowiki -F nt -f data.nt
        exec qlever-server -i neowiki -p 7019 -a "$$QLEVER_ACCESS_TOKEN" -m 1G --service-allowed-iri-prefixes -
    environment:
      - QLEVER_ACCESS_TOKEN=${QLEVER_ACCESS_TOKEN:-neowiki_dev_token}
