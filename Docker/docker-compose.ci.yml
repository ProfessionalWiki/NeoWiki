services:
  mediawiki:
    image: ghcr.io/professionalwiki/neowiki:latest
    ports:
      - "127.0.0.1:${MW_SERVER_PORT}:80"
      - "127.0.0.1:8486:8486"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - no-egress
    environment:
      # Duplicated from docker-compose.yml, which the image-build workflow replaces with this file.
      - MARIADB_HOST=${MARIADB_HOST:-db}
      - MARIADB_PORT=${MARIADB_PORT:-3306}
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
      - MW_SERVER
      - OXIGRAPH_URL
    healthcheck:
      test: "curl -fsSL http://localhost:80/index.php/Special:Version | grep 'Jeroen De Dauw'"
      interval: 60s
      timeout: 5s
      retries: 1

  db:
    image: mariadb:11.8
    environment:
      - MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
    healthcheck:
      test: ["CMD", "mariadb-admin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 4

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:0.5.13
    command: serve --location /data --bind 0.0.0.0:7878 --union-default-graph
    networks:
      - no-egress

networks:
  no-egress:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
