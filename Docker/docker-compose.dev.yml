services:
  mediawiki:
    image: !reset null
    build:
      context: .
      target: dev-mw
    # Every service is capped so one dev stack has a bounded worst case. The Neo4j
    # services also pin heap/pagecache, which otherwise auto-size from total host RAM.
    mem_limit: 2g
    environment:
      - MW_MODE=dev
    volumes:
      - mediawiki-images-data:/var/www/html/w/images
      # NeoWiki source bind-mount (the worktree).
      - ../:/var/www/html/w/extensions/NeoWiki:z
      # Optional read-only overlay of additional MediaWiki extensions for IDE indexing
      # or integration testing. Set MW_EXTRA_EXTENSIONS_DIR to a host directory of
      # extensions; when unset, falls back to a tracked empty dir so the mount is
      # always valid. Files here are not auto-loaded.
      - ${MW_EXTRA_EXTENSIONS_DIR:-./empty-extensions-extra}:/var/www/html/w/extensions-extra:ro,z
      # Per-worktree opt-in override that the user edits to load extra extensions,
      # tweak debug toggles, etc. The Makefile's bootstrap target touches this file
      # on the host so the bind mount is always valid; SettingsTemplate.php's
      # require_once is gated on file_exists so an empty file is harmless.
      - ./LocalSettings.local.php:/var/www/html/w/LocalSettings.local.php:z
      # Bind-mount MW core's vendor directory back to the host so the entrypoint's
      # composer update (which merges NeoWiki deps via composer-merge-plugin) writes
      # through. Result: host's Docker/mediawiki/vendor/ ends up with the full
      # post-merge state, which IDE autocomplete and AI tooling rely on.
      # composer.lock stays in the image (MW REL1_43 does not track one) — small
      # inconsistency, but it stops a non-existent file from being bind-mounted as
      # an empty directory.
      - ./mediawiki/vendor:/var/www/html/w/vendor:z

  neo:
    environment:
      # Low initial heap with the ceiling left where it was: the JVM grows into it
      # under load but does not hold it while the stack sits idle, which is most of
      # the time. AlwaysPreTouch (a Neo4j default) would defeat that by committing
      # and touching the whole heap at startup.
      - NEO4J_server_memory_heap_initial__size=128m
      - NEO4J_server_memory_heap_max__size=512m
      # Off-heap and pre-allocated, so it costs its full size from startup. A dev
      # graph is a few hundred nodes; raise this if you work with a large one.
      - NEO4J_server_memory_pagecache_size=64m
      - NEO4J_server_jvm_additional=-XX:-AlwaysPreTouch
    mem_limit: 1536m

  db:
    command: --innodb-buffer-pool-size=128M
    mem_limit: 512m

  # Dev-only sidecars. They live in this overlay (not the base file) so the base
  # "try-it-out" stack stays minimal and so `make down` removes them as orphans
  # regardless of the compose backend. See the Makefile `down` target.

  # Only the PHP test targets use `test_neo`, so `make dev` should not pay for a second Neo4j
  # JVM. `make phpunit` starts the profile on demand.
  test_neo:
    profiles:
      - test
    image: neo4j:enterprise
    restart: unless-stopped
    volumes:
      - test-neo4j-data:/data
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=eval
      # Hardcoded password (intentional): NeoWiki's test suite uses this
      # fixed credential to connect to the test Neo4j instance. Do not
      # parameterize without also updating the test configuration.
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_bolt_listen__address=:7689
      - NEO4J_server_http_listen__address=:7475
      # Smaller than neo: only holds the PHPUnit graph fixtures. Same low-floor /
      # unchanged-ceiling shape as neo above.
      - NEO4J_server_memory_heap_initial__size=128m
      - NEO4J_server_memory_heap_max__size=384m
      - NEO4J_server_memory_pagecache_size=64m
      - NEO4J_server_jvm_additional=-XX:-AlwaysPreTouch
    mem_limit: 1g
    healthcheck:
      test: "wget http://localhost:7475/browser -O - | grep 'Neo4j Browser'"
      interval: 5s
      timeout: 1s
      retries: 10

  # Dedicated QLever store for the SPARQL query system test, isolated from the `qlever` service in
  # docker-compose.yml the way `test_neo` is isolated from `neo`: the system test writes and deletes
  # Subjects, so it must not mutate the wiki's data. It reaches this in-network as http://test_qlever:7019/ (see
  # QLEVER_TEST_URL in phpunit.xml.dist); no host port is exposed. Behind the `test` profile,
  # like `test_neo`.
  test_qlever:
    profiles:
      - test
    image: docker.io/adfreiburg/qlever:latest
    restart: unless-stopped
    # Same ceiling as the `qlever` service in docker-compose.yml.
    mem_limit: 1536m
    # Fixed access token (intentional, like test_neo's fixed password): the test suite uses this exact
    # value to authorize its updates. Do not parameterize without updating phpunit.xml.dist.
    environment:
      - QLEVER_ACCESS_TOKEN=neowiki_test_token
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -e
        # Same rootful-Docker ownership fix as the `qlever` service in docker-compose.yml: the image runs as
        # non-root "qlever" and Docker mounts test-qlever-index-data root-owned, so take ownership via
        # the image's sudo grant. A no-op under rootless Podman.
        sudo chown qlever:qlever /index
        cd /index
        # Build an empty index once; the sentinel keeps a container restart from re-indexing (which
        # would error on the existing index). NeoWiki fills the store at runtime over the SPARQL 1.1
        # Update endpoint. Unlike the `qlever` service, --persist-updates is deliberately omitted:
        # this store is ephemeral test scaffolding — each test run clears it (DROP ALL) and never relies
        # on updates surviving a restart — so keeping updates in memory is simpler and lighter.
        if [ ! -f .neowiki-indexed ]; then
          : > data.nt
          qlever-index -i neowiki -F nt -f data.nt
          touch .neowiki-indexed
        fi
        # --service-allowed-iri-prefixes disables SPARQL federation, as on the `qlever` service
        # in docker-compose.yml; see the comment there. No test federates, so deny-all is also what
        # the system test should run against.
        exec qlever-server -i neowiki -p 7019 -a "$$QLEVER_ACCESS_TOKEN" -m 1G --service-allowed-iri-prefixes -
    volumes:
      - test-qlever-index-data:/index
    stop_grace_period: 2s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7019/?query=SELECT%20%2A%20WHERE%20%7B%20%3Fs%20%3Fp%20%3Fo%20%7D%20LIMIT%201"]
      interval: 5s
      timeout: 5s
      retries: 20

  node:
    image: node:24
    restart: on-failure:3
    mem_limit: 1536m
    # Run as the host user so node_modules/ and dist/ written into the bind mount
    # are host-owned, matching the Makefile's EXEC_USER. The Makefile exports
    # NODE_USER (host uid:gid under rootful Docker, 0:0 under rootless Podman, which
    # remaps container-root to the host user). The 1000:1000 default only covers a
    # manual `docker compose up` (outside make) on a host whose uid is 1000.
    user: "${NODE_USER:-1000:1000}"
    working_dir: /workspace/resources/ext.neowiki
    volumes:
      - ../:/workspace:z
    command: sh -c "npm install && npm run build:watch"
    environment:
      - npm_config_cache=/tmp/.npm
      # NODE_USER is the host's `id -u`, which on another machine may have no
      # /etc/passwd entry in node:24 — HOME would then default to the unwritable
      # '/'. Give npm a writable HOME for its logs/config. (On a uid-1000 host this
      # is a no-op: uid 1000 is the image's `node` user, HOME=/home/node.)
      - HOME=/tmp

  mailcatcher:
    image: sj26/mailcatcher
    restart: unless-stopped
    ports:
      - "${MAILCATCHER_PORT:-1080}:1080"
    mem_limit: 256m

volumes:
  test-neo4j-data:
  test-qlever-index-data:
