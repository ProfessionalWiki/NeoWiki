services:
  # Opt-in port exposure for graph inspection tools. Activate by including this
  # overlay alongside the dev overlay, or by running `make dev-tools` from the
  # extension root.
  #
  # Default ports (7474, 7687, 7019, 7878) are the Neo4j, QLever and Oxigraph conventions
  # and are not auto-allocated, so run the tools overlay with one worktree at a time.
  # Override via env (NEO_BROWSER_PORT / NEO_BOLT_PORT / QLEVER_PORT / OXIGRAPH_PORT) to
  # run several simultaneously.
  neo:
    ports:
      - "${NEO_BROWSER_PORT:-7474}:7474"
      - "${NEO_BOLT_PORT:-7687}:7687"

  # Exposes the dev QLever SPARQL endpoint on the host for manual querying, e.g.
  #   curl http://localhost:7019/ --data-urlencode 'query=SELECT (COUNT(*) AS ?n) WHERE { GRAPH ?g { ?s ?p ?o } }' -H 'Accept: application/sparql-results+json'
  qlever:
    ports:
      - "${QLEVER_PORT:-7019}:7019"

  # Exposes the dev Oxigraph SPARQL endpoint on the host. Its query and update operations live on
  # separate paths, unlike QLever's single one, e.g.
  #   curl http://localhost:7878/query --data-urlencode 'query=SELECT (COUNT(*) AS ?n) WHERE { GRAPH ?g { ?s ?p ?o } }' -H 'Accept: application/sparql-results+json'
  oxigraph:
    ports:
      - "${OXIGRAPH_PORT:-7878}:7878"
