services:
  mediawiki:
    # The bundled Makefile sets the tag that matches the checkout.
    image: ghcr.io/professionalwiki/neowiki:${NEOWIKI_IMAGE_TAG:-latest}
    restart: unless-stopped
    # LocalSettings routes the NeoWiki log channel here, and a stack whose EDM projection has no Mapping
    # page reports a failure on every save. Rotate, so a long-running stack cannot fill the host with it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Loopback only, so other machines reach the wiki through Caddy's HTTPS (the server profile) rather
    # than over plain HTTP. Do not leave that to a host firewall: Docker's published ports bypass ufw.
    ports:
      - "127.0.0.1:${MW_SERVER_PORT:-8484}:80"
    volumes:
      - mediawiki-images-data:/var/www/html/w/images
      # Uncomment to use custom LocalSettings.
      # - ./LocalSettings.php:/var/www/html/w/LocalSettings.php:ro
    depends_on:
      db:
        condition: service_healthy
      # Neo4j is optional, so the wiki waits for it only when it runs.
      neo:
        condition: service_healthy
        required: false
    networks:
      - default
      - no-egress
    environment:
      # Where the wiki reaches the backing services, defaulted here so a Docker/.env without
      # these still starts a working stack. See Docker/README.md.
      - MARIADB_HOST=${MARIADB_HOST:-db}
      - MARIADB_PORT=${MARIADB_PORT:-3306}
      - NEO4J_SCHEME=${NEO4J_SCHEME:-bolt}
      - NEO4J_PORT=${NEO4J_PORT:-7687}
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
      - MW_SERVER
      - NEO4J_URL_EXTERNAL
      - NEO4J_USERNAME
      - NEO4J_PASSWORD
      # Where the wiki reaches each graph store; empty or unset leaves that store unconfigured.
      # The bundled Makefile sets each one `services=` selects, so these have no defaults.
      - OXIGRAPH_URL
      - NEO4J_HOST
      - QLEVER_URL
      # Bearer token the wiki sends to authorize SPARQL updates. Defaulted here instead of being
      # required from Docker/.env, so a .env written before the variable existed still works; the
      # qlever service below defaults it the same way, so wiki and server always agree.
      - QLEVER_ACCESS_TOKEN=${QLEVER_ACCESS_TOKEN:-neowiki_dev_token}
      # Empty means "no SMTP" to SettingsTemplate.php (set by the Makefile when the
      # mailcatcher service is deselected); unset means "use the mode's default".
      - MW_SMTP_HOST
    healthcheck:
      test: "curl -fs http://localhost:80/wiki/Special:Version | grep -q 'Jeroen De Dauw'"
      interval: 60s
      timeout: 5s
      retries: 1

  db:
    image: mariadb:11.8
    restart: unless-stopped
    volumes:
      - mediawiki-db-data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
    healthcheck:
      test: ["CMD", "mariadb-admin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 4

  # Serves the Cypher query surfaces. Opt-in: the Makefile runs it when `services=` names it.
  neo:
    profiles:
      - neo
    # Community Edition, since Enterprise's free licence only covers a 30-day internal evaluation. 5.26 is the
    # LTS line and the oldest one NeoWiki supports; test_neo and CI run the same image, so the test suite
    # covers that line.
    image: neo4j:5.26-community
    restart: unless-stopped
    # A large store's shutdown outlasts compose's default ten seconds, and `neo4j-admin database dump`
    # refuses the store a killed server leaves behind.
    stop_grace_period: 120s
    volumes:
      - neo4j-data:/data
    environment:
      - NEO4J_AUTH
    healthcheck:
      test: "wget http://localhost:7474/browser -O - | grep 'Neo4j Browser'"
      interval: 5s
      timeout: 1s
      retries: 10

  # The default graph store: the Makefile's default selection runs it and points the wiki at
  # it through QLEVER_URL above. A host port is opt-in via docker-compose.tools.yml.
  qlever:
    profiles:
      - qlever
    # The build of 2026-10-23 (commit 42b25c3), by digest: QLever's last release, v0.6.0, cannot load
    # the index format its builds have written since September 2026.
    image: docker.io/adfreiburg/qlever@sha256:881f3762f89fdb831b085503d61c87c9894dad6e6769f1774dd253925fbb4e4c
    restart: unless-stopped
    # Room for QLever's -m 1G query budget (server command below) plus index overhead and rebuilds.
    mem_limit: 1536m
    # The image's default entrypoint is an interactive CLI wrapper.
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -e
        # On rootful Docker the qlever-index-data volume mounts empty and root-owned, so the
        # image's non-root "qlever" user cannot write the index or persisted updates. Rootless
        # Podman already makes the fresh volume qlever-owned, so this is a no-op.
        sudo chown qlever:qlever /index
        cd /index
        # The index starts empty: NeoWiki fills the store over the SPARQL Update endpoint. The
        # sentinel keeps a restart from re-indexing, which would wipe the store.
        if [ ! -f .neowiki-indexed ]; then
          : > data.nt
          qlever-index -i neowiki -F nt -f data.nt
          touch .neowiki-indexed
        fi
        # --persist-updates and the --rebuild-* options: see "QLever" in docs/operations/installation.md.
        # The rebuild maximum of 50 000 delta triples keeps what a save gains within ADR 29's 100 ms
        # at 100 000 Subjects; upstream's example of 1 000 000 does not.
        # --no-metrics-log: without it QLever writes every request's full text to a log next to the
        # index, which grows without bound.
        # --service-allowed-iri-prefixes with "-" denies SPARQL federation; see "Restricting
        # federation" in docs/operations/installation.md. Keep it last: it takes any number of
        # prefixes, so a bare value after it would be read as another prefix.
        exec qlever-server -i neowiki -p 7019 -a "$$QLEVER_ACCESS_TOKEN" -m 1G --persist-updates --rebuild-index-strategy automatic:10000:50000:0.1 --rebuild-keep-previous-index-dirs none --no-metrics-log --service-allowed-iri-prefixes -
    environment:
      # Same default as the mediawiki service above, so the server and the wiki agree on the token
      # even when Docker/.env predates the variable or leaves it empty.
      - QLEVER_ACCESS_TOKEN=${QLEVER_ACCESS_TOKEN:-neowiki_dev_token}
    volumes:
      # Named volume (not a bind mount) so the index directory avoids host SELinux
      # labeling / ownership issues under rootless Podman.
      - qlever-index-data:/index
    # qlever-server ignores SIGTERM/SIGINT, so a short grace period keeps `make down`
    # snappy. Safe: updates are persisted at acknowledgement time, so the kill loses none.
    stop_grace_period: 2s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7019/?query=SELECT%20%2A%20WHERE%20%7B%20%3Fs%20%3Fp%20%3Fo%20%7D%20LIMIT%201"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A second SPARQL store, opt-in like neo. The wiki reaches it through OXIGRAPH_URL above;
  # a host port is opt-in via docker-compose.tools.yml.
  #
  # No healthcheck: the image is distroless, its only executable being the oxigraph binary,
  # so a compose healthcheck — which runs inside the container — has no shell or curl to run. Wait
  # for it from outside instead, as `make test-backends` and .github/workflows/ci-php.yml do.
  oxigraph:
    profiles:
      - oxigraph
    image: ghcr.io/oxigraph/oxigraph:0.5.13
    restart: unless-stopped
    # Parity with the qlever service, so swapping which engine a stack points at does not change
    # the stack's memory ceiling.
    mem_limit: 1536m
    # --union-default-graph: unscoped queries see every named graph, as QLever does (see Docker/README.md).
    command: serve --location /data --bind 0.0.0.0:7878 --union-default-graph
    # Only the network below, which has no route out of the stack.
    networks:
      - no-egress
    volumes:
      # Named volume, for the same reasons as qlever-index-data above.
      - oxigraph-data:/data
    # Oxigraph ignores SIGTERM as qlever does, so it gets the same short grace period to keep
    # `make down` snappy. Safe: acknowledged updates survive a SIGKILL and reload on startup.
    stop_grace_period: 2s

  # The dev-only sidecars (test_neo, test_qlever, test_oxigraph, node, mailcatcher) live in
  # docker-compose.dev.yml, not here, so `make up` stays minimal and `make down`
  # can clean them up as orphans on every compose backend (see that file).

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    profiles:
      - server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - MW_SERVER
    depends_on:
      - mediawiki

networks:
  # Oxigraph follows every SERVICE clause and has no setting to stop it, and anyone holding
  # neowiki-query, anonymous visitors by default, can query it. This network has no route out
  # and only the wiki shares it.
  no-egress:
    internal: true
    # Docker still gives an internal network's bridge an address on the host, through which the
    # store could reach the host's own services. This withholds it.
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"

volumes:
  mediawiki-db-data:
  mediawiki-images-data:
  neo4j-data:
  qlever-index-data:
  oxigraph-data:
  caddy-data:
  caddy-config:
