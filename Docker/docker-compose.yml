services:
  mediawiki:
    image: ghcr.io/professionalwiki/neowiki:latest
    restart: unless-stopped
    ports:
      - "${MW_SERVER_PORT:-8484}:80"
    volumes:
      - mediawiki-images-data:/var/www/html/w/images
      # Uncomment to use custom LocalSettings.
      # - ./LocalSettings.php:/var/www/html/w/LocalSettings.php:ro
    depends_on:
      db:
        condition: service_healthy
      neo:
        condition: service_healthy
    environment:
      # Where the wiki reaches the backing services, defaulted here so a Docker/.env without
      # these still starts a working stack. See Docker/README.md.
      - MARIADB_HOST=${MARIADB_HOST:-db}
      - MARIADB_PORT=${MARIADB_PORT:-3306}
      - NEO4J_SCHEME=${NEO4J_SCHEME:-bolt}
      - NEO4J_HOST=${NEO4J_HOST:-neo}
      - NEO4J_PORT=${NEO4J_PORT:-7687}
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
      - MW_SERVER
      - NEO4J_URL_EXTERNAL
      - NEO4J_USERNAME
      - NEO4J_PASSWORD
      - NEO4J_USERNAME_READ
      - NEO4J_PASSWORD_READ
      # Endpoint of the qlever service below; a non-empty value is what makes
      # SettingsTemplate.php configure $wgNeoWikiSparqlStores. The bundled Makefile
      # owns the value: the qlever endpoint when the service is selected, empty
      # ("disabled") when deselected. Without the Makefile it is unset and no
      # store is configured.
      - QLEVER_URL
      # Bearer token the wiki sends to authorize SPARQL updates. Defaulted here instead of being
      # required from Docker/.env, so a .env written before the variable existed still works; the
      # qlever service below defaults it the same way, so wiki and server always agree.
      - QLEVER_ACCESS_TOKEN=${QLEVER_ACCESS_TOKEN:-neowiki_dev_token}
      # Empty means "no SMTP" to SettingsTemplate.php (set by the Makefile when the
      # mailcatcher service is deselected); unset means "use the mode's default".
      - MW_SMTP_HOST
    healthcheck:
      test: "curl -fs http://localhost:80/wiki/Special:Version | grep -q 'Jeroen De Dauw'"
      interval: 60s
      timeout: 5s
      retries: 1

  # NOTE (v2 shared-backend mode): in a future iteration, db and neo will
  # be tagged with a `local-backend` profile so they can be opted out of when
  # SHARED_BACKEND=1 is set, allowing multiple worktrees to share an external
  # MariaDB and Neo4j instance. In v1 they stay on by default (no profile).
  db:
    image: mariadb:11.8
    restart: unless-stopped
    volumes:
      - mediawiki-db-data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
    healthcheck:
      test: ["CMD", "mariadb-admin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 4

  neo:
    image: neo4j:enterprise
    restart: unless-stopped
    volumes:
      - neo4j-data:/data
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=eval
      - NEO4J_AUTH
    healthcheck:
      test: "wget http://localhost:7474/browser -O - | grep 'Neo4j Browser'"
      interval: 5s
      timeout: 1s
      retries: 10

  # SPARQL 1.1 graph store (QLever) for the SPARQL projection plugin (#586), as a working example
  # of NeoWiki's SPARQL projection: every page save and RebuildGraphDatabases.php also projects the
  # page's RDF here as named graphs, and the query surfaces read from it. The wiki is pointed at it
  # by QLEVER_URL above. Unconditional in this file; the dev overlay gates it behind a `qlever`
  # profile for `services=` selection — see the comment there. NeoWiki reaches it in-network as
  # http://qlever:7019/; a host port for manual inspection is opt-in via docker-compose.tools.yml.
  qlever:
    image: docker.io/adfreiburg/qlever:latest
    restart: unless-stopped
    # Above QLever's own -m 1G query budget (server command below) plus index overhead.
    mem_limit: 1536m
    # The image's default entrypoint is an interactive CLI wrapper; bypass it and drive
    # the engine binaries (qlever-index / qlever-server) directly.
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -e
        # The image runs as the non-root "qlever" user, but on rootful Docker the qlever-index-data
        # volume mounts empty and root-owned (the image ships no /index for Docker to copy ownership
        # from), so qlever cannot write the index or persisted updates. Take ownership via the image's
        # sudo grant. Rootless Podman already makes the fresh volume qlever-owned, so this is a no-op.
        sudo chown qlever:qlever /index
        cd /index
        # Build an empty index once. The sentinel keeps a container restart from
        # re-indexing, which would wipe the persisted SPARQL updates. NeoWiki fills the
        # store at runtime over the SPARQL 1.1 Update endpoint (page edits and
        # RebuildGraphDatabases.php), not from a source file.
        if [ ! -f .neowiki-indexed ]; then
          : > data.nt
          qlever-index -i neowiki -F nt -f data.nt
          touch .neowiki-indexed
        fi
        # --persist-updates is mandatory: without it every SPARQL update is lost on
        # restart. With it, updates persist to neowiki.update-triples on the named volume
        # and are reloaded on startup.
        # --service-allowed-iri-prefixes disables SPARQL federation. NeoWiki's query surfaces
        # let wiki users send arbitrary SPARQL, and SERVICE makes the store issue outbound
        # requests from its own network position — here, inside the compose network. QLever
        # allows every IRI when the option is omitted, so this sets the documented deny-all
        # value: an invalid prefix ("-") that no IRI can match. Drop or narrow it only if you
        # actually want federation, and then list real prefixes rather than removing the flag.
        # Keep it last: it takes an arbitrary number of prefixes, so a bare value placed
        # after it would be read as another prefix.
        exec qlever-server -i neowiki -p 7019 -a "$$QLEVER_ACCESS_TOKEN" -m 1G --persist-updates --service-allowed-iri-prefixes -
    environment:
      # Same default as the mediawiki service above, so the server and the wiki agree on the token
      # even when Docker/.env predates the variable or leaves it empty.
      - QLEVER_ACCESS_TOKEN=${QLEVER_ACCESS_TOKEN:-neowiki_dev_token}
    volumes:
      # Named volume (not a bind mount) so the index directory avoids host SELinux
      # labeling / ownership issues under rootless Podman, and so the index plus its
      # persisted updates survive container restarts.
      - qlever-index-data:/index
    # qlever-server ignores SIGTERM/SIGINT, so a short grace period keeps `make down`
    # snappy. Safe: updates are persisted at acknowledgement time, so the kill loses none.
    stop_grace_period: 2s
    healthcheck:
      # Minimal SPARQL query over the endpoint via GET (URL-encoded, so no shell quoting):
      # SELECT * WHERE { ?s ?p ?o } LIMIT 1. Returns 200 once the server is serving.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7019/?query=SELECT%20%2A%20WHERE%20%7B%20%3Fs%20%3Fp%20%3Fo%20%7D%20LIMIT%201"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A second SPARQL 1.1 graph store engine (Oxigraph), alongside the qlever service above, so the
  # SPARQL projection plugin (#586) can be exercised against more than one implementation. Nothing
  # points at it by default, so it sits behind its own profile and neither stack starts it: use
  # `COMPOSE_PROFILES=oxigraph make dev`. QLEVER_URL is what the mediawiki service above is given, so
  # even a started service holds nothing until you repoint $wgNeoWikiSparqlStores in
  # Docker/LocalSettings.local.php at http://oxigraph:7878/update and http://oxigraph:7878/query —
  # separate paths, unlike QLever's single one, so an entry needs both updateUrl and queryUrl. A host
  # port for manual inspection is opt-in via docker-compose.tools.yml, which is also why this service
  # is defined here rather than in the dev overlay: that overlay works on either stack, so a service
  # it maps a port for has to exist in this file.
  #
  # No entrypoint script: unlike QLever there is no index to build, and --location below is the whole
  # of persistence.
  #
  # No healthcheck either. The image is distroless, its only executable being the oxigraph binary,
  # so a compose healthcheck — which runs inside the container — has no shell or curl to run. Wait
  # for it from outside instead, as `make test-backends` and .github/workflows/ci-php.yml do.
  oxigraph:
    profiles:
      - oxigraph
    image: ghcr.io/oxigraph/oxigraph:latest
    restart: unless-stopped
    # Parity with the qlever service, so swapping which engine a stack points at does not change
    # the stack's memory ceiling.
    mem_limit: 1536m
    # --union-default-graph: unscoped queries see every named graph, as QLever does (see Docker/README.md).
    command: serve --location /data --bind 0.0.0.0:7878 --union-default-graph
    volumes:
      # Named volume, for the same reasons as qlever-index-data above.
      - oxigraph-data:/data
    # Oxigraph ignores SIGTERM as qlever does, so it gets the same short grace period to keep
    # `make down` snappy. Safe: acknowledged updates survive a SIGKILL and reload on startup.
    stop_grace_period: 2s

  # The dev-only sidecars (test_neo, test_qlever, test_oxigraph, node, mailcatcher) live in
  # docker-compose.dev.yml, not here, so `make up` stays minimal and `make down`
  # can clean them up as orphans on every compose backend (see that file).

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    profiles:
      - server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - MW_SERVER
    depends_on:
      - mediawiki

volumes:
  mediawiki-db-data:
  mediawiki-images-data:
  neo4j-data:
  qlever-index-data:
  oxigraph-data:
  caddy-data:
  caddy-config:
